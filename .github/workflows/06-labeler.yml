# Step 06. Labels pull requests by the files they change. Rules live in .github/labeler.yml.
# pull_request_target runs the trusted copy from main, so it can label PRs from forks.
# It never checks out the PR code.
name: 06 Labeler

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: 06-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
